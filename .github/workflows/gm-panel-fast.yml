name: GM Panel Hizli Derleme (1 dk)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'gm-panel/**'
permissions:
  contents: write
jobs:
  build-gm-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: GM Panel APK Derle
        run: |
          cd gm-panel
          gradle assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/metin2-gm-panel.apk
      - name: Releases Yukle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-apks >/dev/null 2>&1 || gh release create latest-apks --title "Latest APKs" --notes "Guncel APK paketleri"
          gh release upload latest-apks /tmp/metin2-gm-panel.apk --clobber
