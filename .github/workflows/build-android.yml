{"name":"MOBILE2-LAB Android APK Build","on":{"push":{"branches":["main","master"],"paths-ignore":["research/**","README.md"]},"workflow_dispatch":{}},"jobs":{"build-android-apk":{"runs-on":"ubuntu-latest","steps":[{"name":"1. Android Istemci Kaynak Kodunu Cek","run":"rm -rf client-src && git clone --depth 1 https://github.com/cemreefe/metin2-android.git client-src && cd client-src && (git submodule update --init --recursive || true)"},{"name":"2. Java 17 Kur","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"3. Android SDK Araclarini ve Lisanslarini Hazirla","run":"SDK_ROOT=\"${ANDROID_HOME:-/usr/local/lib/android/sdk}\" && echo \"ANDROID_HOME=$SDK_ROOT\" >> \"$GITHUB_ENV\" && echo \"ANDROID_SDK_ROOT=$SDK_ROOT\" >> \"$GITHUB_ENV\" && SDKMGR=$(find \"$SDK_ROOT\" -name sdkmanager -type f | head -n 1) && ((yes || true) | \"$SDKMGR\" --sdk_root=\"$SDK_ROOT\" --licenses > /dev/null || true)"},{"name":"4. SDK Platform 33 ve Build-Tools Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"platform-tools\" \"platforms;android-33\" \"build-tools;33.0.2\""},{"name":"5. NDK 25.2.9519653 Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"ndk;25.2.9519653\" && echo \"ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653\" >> \"$GITHUB_ENV\""},{"name":"6. CMake Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"cmake;3.22.1\""},{"name":"7. MainActivity NPE Yamasi","run":"python3 -c 'p=\"client-src/r10dev.net OPENGL-ITJA/android/app/src/main/java/com/metin2/client/MainActivity.java\"; s=open(p).read(); s=s.replace(\"mStatus.setText\", \"if(mStatus!=null)mStatus.setText\"); s=s.replace(\"mProgress.set\", \"if(mProgress!=null)mProgress.set\"); s=s.replace(\"mAction.set\", \"if(mAction!=null)mAction.set\"); s=s.replace(\"GameView view = activity.mView;\", \"GameView view = activity.mView; if(view==null)return;\"); open(p,\"w\").write(s)'"},{"name":"8. Gradle ile ARM64 Android Istemcisini Derle","run":"CLIENT_SRC_DIR=\"client-src/r10dev.net OPENGL-ITJA/clientsource\" && if [ -d \"$CLIENT_SRC_DIR\" ]; then cd \"$CLIENT_SRC_DIR\" && [ -d UserInterface ] && [ ! -e userInterface ] && ln -s UserInterface userInterface || true && [ -d eterPack ] && [ ! -e EterPack ] && ln -s eterPack EterPack || true && cd - > /dev/null; fi && BUILD_DIR=\"client-src/r10dev.net OPENGL-ITJA/android\" && echo \"Derleme dizini: $BUILD_DIR\" && cd \"$BUILD_DIR\" && echo \"sdk.dir=$ANDROID_HOME\" > local.properties && curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13.zip && unzip -q -o /tmp/gradle-8.13.zip -d /tmp/gradle-dist && /tmp/gradle-dist/gradle-8.13/bin/gradle assembleDebug --no-daemon -Pm2abi=arm64-v8a"},{"name":"9. APK ve ARM64 Mimarisini Dogrula","run":"APK=$(find client-src -type f -name '*.apk' | head -n 1) && if [ -z \"$APK\" ]; then echo 'HATA: APK uretilmedi'; exit 1; fi && echo \"APK: $APK\" && ls -lh \"$APK\" && if unzip -l \"$APK\" | grep -q 'lib/arm64-v8a/libmetin2_mobile.so'; then echo 'BASARILI: ARM64 native istemci bulundu'; else echo 'HATA: ARM64 libmetin2_mobile.so APK icinde yok'; exit 1; fi"},{"name":"10. APK Dosyasini Artifacts Bolumune Yukle","uses":"actions/upload-artifact@v4","with":{"name":"mobile2-lab-arm64-apk","path":"client-src/**/*.apk","if-no-files-found":"error","retention-days":7}}]}}}
