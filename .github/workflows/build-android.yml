name: MOBILE2-LAB Android APK Build
on:
  push:
      branches:
            - main
                  - master
                      paths-ignore:
                            - research/**
                                  - README.md
                                    workflow_dispatch:

                                    jobs:
                                      build-android-apk:
                                          runs-on: ubuntu-latest
                                              steps:
                                                    - name: 1. Kaynak Kodu Cek
                                                            run: |
                                                                      rm -rf client-src
                                                                                git clone --depth 1 https://github.com/cemreefe/metin2-android.git client-src
                                                                                          cd client-src && (git submodule update --init --recursive || true)

                                                                                                - name: 2. Java 17 Kur
                                                                                                        uses: actions/setup-java@v4
                                                                                                                with:
                                                                                                                          distribution: temurin
                                                                                                                                    java-version: '17'

                                                                                                                                          - name: 3. SDK Lisanslari
                                                                                                                                                  run: |
                                                                                                                                                            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
                                                                                                                                                                      echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
                                                                                                                                                                                echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
                                                                                                                                                                                          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
                                                                                                                                                                                                    ((yes || true) | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true)

                                                                                                                                                                                                          - name: 4. Platform 33 ve Build-Tools
                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                            SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
                                                                                                                                                                                                                                      "$SDKMGR" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

                                                                                                                                                                                                                                            - name: 5. NDK Kur
                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                              SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
                                                                                                                                                                                                                                                                        "$SDKMGR" --sdk_root="$ANDROID_HOME" "ndk;25.2.9519653"
                                                                                                                                                                                                                                                                                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

                                                                                                                                                                                                                                                                                        - name: 6. CMake Kur
                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
                                                                                                                                                                                                                                                                                                                    "$SDKMGR" --sdk_root="$ANDROID_HOME" "cmake;3.22.1"

                                                                                                                                                                                                                                                                                                                          - name: 7. MainActivity NPE Yamasi
                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                            F="client-src/r10dev.net OPENGL-ITJA/android/app/src/main/java/com/metin2/client/MainActivity.java"
                                                                                                                                                                                                                                                                                                                                                      sed -i 's/mStatus\.setText(/if (mStatus != null) mStatus.setText(/g' "$F"
                                                                                                                                                                                                                                                                                                                                                                sed -i 's/mStatus\.setTextSize(/if (mStatus != null) mStatus.setTextSize(/g' "$F"
                                                                                                                                                                                                                                                                                                                                                                          sed -i 's/mProgress\.setIndeterminate(/if (mProgress != null) mProgress.setIndeterminate(/g' "$F"
                                                                                                                                                                                                                                                                                                                                                                                    sed -i 's/mProgress\.setProgress(/if (mProgress != null) mProgress.setProgress(/g' "$F"
                                                                                                                                                                                                                                                                                                                                                                                              sed -i 's/mAction\.setVisibility(/if (mAction != null) mAction.setVisibility(/g' "$F"
                                                                                                                                                                                                                                                                                                                                                                                                        sed -i 's/GameView view = activity\.mView;/GameView view = activity.mView; if (view == null) return;/g' "$F"

                                                                                                                                                                                                                                                                                                                                                                                                              - name: 8. ARM64 APK Derle
                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                S="client-src/r10dev.net OPENGL-ITJA/clientsource"
                                                                                                                                                                                                                                                                                                                                                                                                                                          cd "$S"
                                                                                                                                                                                                                                                                                                                                                                                                                                                    [ -d UserInterface ] && [ ! -e userInterface ] && ln -s UserInterface userInterface || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                              [ -d eterPack ] && [ ! -e EterPack ] && ln -s eterPack EterPack || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        cd - > /dev/null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cd "client-src/r10dev.net OPENGL-ITJA/android"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "sdk.dir=$ANDROID_HOME" > local.properties
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/g.zip
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                unzip -q -o /tmp/g.zip -d /tmp/gd
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /tmp/gd/gradle-8.13/bin/gradle assembleDebug --no-daemon -Pm2abi=arm64-v8a

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: 9. APK Dogrula
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  APK=$(find client-src -type f -name '*.apk' | head -n 1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if [ -z "$APK" ]; then echo "HATA: APK uretilmedi"; exit 1; fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ls -lh "$APK"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmetin2_mobile.so'

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: 10. APK Yukle
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                name: mobile2-lab-arm64-apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          path: client-src/**/*.apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if-no-files-found: error
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              retention-days: 7
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              