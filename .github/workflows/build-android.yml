{"name":"MOBILE2-LAB Android APK Build","on":{"push":{"branches":["main","master"],"paths-ignore":["research/**","README.md"]},"workflow_dispatch":{}},"jobs":{"build-android-apk":{"runs-on":"ubuntu-latest","steps":[{"name":"1. Android Istemci Kaynak Kodunu Cek","run":"rm -rf client-src && git clone --depth 1 https://github.com/cemreefe/metin2-android.git client-src && cd client-src && (git submodule update --init --recursive || true) && ls -la"},{"name":"2. Java 17 Kur","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"3. Android SDK Araclarini ve Lisanslarini Hazirla","run":"SDK_ROOT=\"${ANDROID_HOME:-/usr/local/lib/android/sdk}\" && echo \"ANDROID_HOME=$SDK_ROOT\" >> \"$GITHUB_ENV\" && echo \"ANDROID_SDK_ROOT=$SDK_ROOT\" >> \"$GITHUB_ENV\" && SDKMGR=$(find \"$SDK_ROOT\" -name sdkmanager -type f | head -n 1) && echo \"Kullanilan sdkmanager: $SDKMGR\" && ((yes || true) | \"$SDKMGR\" --sdk_root=\"$SDK_ROOT\" --licenses > /dev/null || true) && ls -la \"$SDK_ROOT/licenses\""},{"name":"4. SDK Platform 33 ve Build-Tools Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"platform-tools\" \"platforms;android-33\" \"build-tools;33.0.2\""},{"name":"5. NDK 25.2.9519653 Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"ndk;25.2.9519653\" && echo \"ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653\" >> \"$GITHUB_ENV\""},{"name":"6. CMake Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"cmake;3.22.1\""},{"name":"7. Gradle ile Android Istemcisini Derle","run":"GRADLEW_PATH=$(find client-src -name \"gradlew\" -type f | head -n 1) && BUILD_DIR=$(dirname \"$GRADLEW_PATH\") && echo \"Bulunan gradlew: $GRADLEW_PATH\" && echo \"Derleme dizini: $BUILD_DIR\" && cd \"$BUILD_DIR\" && echo \"sdk.dir=$ANDROID_HOME\" > local.properties && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace"},{"name":"8. APK Dosyasinin Olustugunu Dogrula","run":"APK_LIST=$(find client-src -name \"*.apk\" -type f) && if [ -z \"$APK_LIST\" ]; then echo \"HATA: APK uretilemedi!\"; exit 1; else echo \"APK basariyla uretildi:\"; ls -lh $APK_LIST; fi"},{"name":"9. APK Dosyasini Artifacts Bolumune Yukle","uses":"actions/upload-artifact@v4","with":{"name":"mobile2-lab-debug-apk","path":"client-src/**/*.apk","if-no-files-found":"error"}}]}}}
)"})"})"})"})")"}]}}}