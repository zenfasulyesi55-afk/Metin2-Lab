{"name":"MOBILE2-LAB Android APK Build","on":{"push":{"branches":["main","master"],"paths-ignore":["research/**","README.md"]},"workflow_dispatch":{}},"jobs":{"build-android-apk":{"runs-on":"ubuntu-latest","steps":[{"name":"1. Android kaynak kodunu indir","run":"rm -rf client-src && git clone --depth 1 https://github.com/cemreefe/metin2-android.git client-src && cd client-src && (git submodule update --init --recursive || true)"},{"name":"2. Java 17 kur","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"3. Android SDK lisanslarini hazirla","run":"SDK_ROOT=\"${ANDROID_HOME:-/usr/local/lib/android/sdk}\" && echo \"ANDROID_HOME=$SDK_ROOT\" >> \"$GITHUB_ENV\" && echo \"ANDROID_SDK_ROOT=$SDK_ROOT\" >> \"$GITHUB_ENV\" && SDKMGR=$(find \"$SDK_ROOT\" -name sdkmanager -type f | head -n 1) && ((yes || true) | \"$SDKMGR\" --sdk_root=\"$SDK_ROOT\" --licenses > /dev/null || true)"},{"name":"4. Android SDK paketlerini kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"platform-tools\" \"platforms;android-33\" \"build-tools;33.0.2\""},{"name":"5. NDK kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"ndk;25.2.9519653\" && echo \"ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653\" >> \"$GITHUB_ENV\""},{"name":"6. CMake kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"cmake;3.22.1\""},{"name":"7. TextView NullPointer hatasini duzelt","run":"python3 - <<'PY'\nfrom pathlib import Path\np = Path('client-src/r10dev.net OPENGL-ITJA/android/app/src/main/java/com/metin2/client/MainActivity.java')\ns = p.read_text()\nold = '''        if (embedded) {\n            showStatusScreen(\"Retry\", new View.OnClickListener() {\n                public void onClick(View v) {\n                    prepareAndStart();\n                }\n            });\n            mProgress.setIndeterminate(true);\n            mStatus.setText(\"Starting local server...\");\n            getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n        }\n'''\nnew = '''        if (embedded) {\n            showStatusScreen(\"Retry\", new View.OnClickListener() {\n                public void onClick(View v) {\n                    prepareAndStart();\n                }\n            });\n            mProgress.setIndeterminate(true);\n            mStatus.setText(\"Starting local server...\");\n            getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n        } else {\n            showStatusScreen(\"Retry\", new View.OnClickListener() {\n                public void onClick(View v) {\n                    prepareAndStart();\n                }\n            });\n        }\n'''\nif old not in s:\n    raise SystemExit('HATA: Beklenen MainActivity kodu bulunamadi; kaynak degismis olabilir. Derleme durduruldu.')\np.write_text(s.replace(old, new, 1))\nprint('BASARILI: MainActivity TextView baslangic ekrani yamasi uygulandi.')\nPY"},{"name":"8. Android istemcisini ARM64 derle","run":"CLIENT_SRC_DIR=\"client-src/r10dev.net OPENGL-ITJA/clientsource\" && if [ -d \"$CLIENT_SRC_DIR\" ]; then cd \"$CLIENT_SRC_DIR\" && [ -d UserInterface ] && [ ! -e userInterface ] && ln -s UserInterface userInterface || true && [ -d eterPack ] && [ ! -e EterPack ] && ln -s eterPack EterPack || true && cd - > /dev/null; fi && BUILD_DIR=\"client-src/r10dev.net OPENGL-ITJA/android\" && cd \"$BUILD_DIR\" && echo \"sdk.dir=$ANDROID_HOME\" > local.properties && curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13.zip && unzip -q -o /tmp/gradle-8.13.zip -d /tmp/gradle-dist && /tmp/gradle-dist/gradle-8.13/bin/gradle assembleDebug --no-daemon -Pm2abi=arm64-v8a"},{"name":"9. APK ve ARM64 mimarisini dogrula","run":"APK=$(find client-src -type f -name '*.apk' | head -n 1) && if [ -z \"$APK\" ]; then echo 'HATA: APK uretilmedi'; exit 1; fi && echo \"APK: $APK\" && ls -lh \"$APK\" && unzip -l \"$APK\" | grep 'lib/arm64-v8a/libmetin2_mobile.so' || { echo 'HATA: ARM64 native istemci APK icinde yok'; exit 1; }"},{"name":"10. APK dosyasini yukle","uses":"actions/upload-artifact@v4","with":{"name":"mobile2-lab-arm64-fixed-apk","path":"client-src/**/*.apk","if-no-files-found":"error","retention-days":7}}]}} 
