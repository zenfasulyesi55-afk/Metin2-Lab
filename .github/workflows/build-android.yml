s;android-33\" \"build-tools;33.0.2\" \"ndk;25.2.9519653\" \"cmake;3.22.1\""},{"name":"5. Sunucu ve Oyun Verilerini Paketle","run":"chmod +x \"client-src/r10dev.net OPENGL-ITJA/server/tools/make-server-pack.sh\" \"client-src/r10dev.net OPENGL-ITJA/android/tools/stage_client_data.sh\" \"client-src/r10dev.net OPENGL-ITJA/android/tools/make_bundle.sh\" \"client-src/r10dev.net OPENGL-ITJA/android/tools/make_icon.sh\" && \"client-src/r10dev.net OPENGL-ITJA/server/tools/make-server-pack.sh\" /tmp/m2dev-server /tmp/m2dev-server-src /tmp/m2serverpack && \"client-src/r10dev.net OPENGL-ITJA/android/tools/stage_client_data.sh\" /tmp/m2dev-client /tmp/m2stage en && rm -rf /tmp/m2dev-client /tmp/m2dev-server"},{"name":"6. Bundled ARM64 Tam APK Derle","run":"ln -s UserInterface \"client-src/r10dev.net OPENGL-ITJA/clientsource/userInterface\" || true && ln -s eterPack \"client-src/r10dev.net OPENGL-ITJA/clientsource/EterPack\" || true && sed -i 's/^m2.abi=.*/m2.abi=arm64-v8a/' \"client-src/r10dev.net OPENGL-ITJA/android/profiles/bundled.properties\" && curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/g.zip && unzip -q -o /tmp/g.zip -d /tmp/gd && rm -f /tmp/g.zip && echo \"sdk.dir=/usr/local/lib/android/sdk\" > \"client-src/r10dev.net OPENGL-ITJA/android/local.properties\" && cd \"client-src/r10dev.net OPENGL-ITJA/android\" && M2_CLIENT_DATA=/tmp/m2stage M2_PYLIB=/tmp/m2pylib M2_BUNDLE_OUT=/tmp/m2bundle M2_SERVER_PACK=/tmp/m2serverpack M2_SERVER_SRC=/tmp/m2dev-server-src GRADLE=/tmp/gd/gradle-8.13/bin/gradle tools/make_bundle.sh bundled 1"},{"name":"7. Tam APK Dogrula","run":"ls -lh /tmp/m2bundle/metin2-bundled-1.apk && unzip -l /tmp/m2bundle/metin2-bundled-1.apk | grep -q \"lib/arm64-v8a/libmetin2_mobile.so\" && unzip -l /tmp/m2bundle/metin2-bundled-1.apk | grep -q \"lib/arm64-v8a/libm2game.so\" && unzip -l /tmp/m2bundle/metin2-bundled-1.apk | grep -q \"assets/m2data.zip\""},{"name":"8. Tam Oyun APK Dosyasini Yukle","uses":"actions/upload-artifact@v4"