{"name":"MOBILE2-LAB Android APK Build","on":{"push":{"branches":["main","master"],"paths-ignore":["research/**","README.md"]},"workflow_dispatch":{}},"jobs":{"build-android-apk":{"runs-on":"ubuntu-latest","steps":[{"name":"1. Android Istemci Kaynak Kodunu Cek","run":"rm -rf client-src && git clone --depth 1 https://github.com/cemreefe/metin2-android.git client-src && cd client-src && (git submodule update --init --recursive || true)"},{"name":"2. Java 17 Kur","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"3. Android SDK Araclarini ve Lisanslarini Hazirla","run":"SDK_ROOT=\"${ANDROID_HOME:-/usr/local/lib/android/sdk}\" && echo \"ANDROID_HOME=$SDK_ROOT\" >> \"$GITHUB_ENV\" && echo \"ANDROID_SDK_ROOT=$SDK_ROOT\" >> \"$GITHUB_ENV\" && SDKMGR=$(find \"$SDK_ROOT\" -name sdkmanager -type f | head -n 1) && ((yes || true) | \"$SDKMGR\" --sdk_root=\"$SDK_ROOT\" --licenses > /dev/null || true)"},{"name":"4. SDK Platform 33 ve Build-Tools Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"platform-tools\" \"platforms;android-33\" \"build-tools;33.0.2\""},{"name":"5. NDK 25.2.9519653 Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"ndk;25.2.9519653\" && echo \"ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653\" >> \"$GITHUB_ENV\""},{"name":"6. CMake Kur","run":"SDKMGR=$(find \"$ANDROID_HOME\" -name sdkmanager -type f | head -n 1) && \"$SDKMGR\" --sdk_root=\"$ANDROID_HOME\" \"cmake;3.22.1\""},{"name":"7. Gradle ile Android Istemcisini Derle","run":"CLIENT_SRC_DIR=\"client-src/r10dev.net OPENGL-ITJA/clientsource\" && if [ -d \"$CLIENT_SRC_DIR\" ]; then cd \"$CLIENT_SRC_DIR\" && [ -d UserInterface ] && [ ! -e userInterface ] && ln -s UserInterface userInterface || true && [ -d eterPack ] && [ ! -e EterPack ] && ln -s eterPack EterPack || true && cd - > /dev/null; fi && BUILD_DIR=\"client-src/r10dev.net OPENGL-ITJA/android\" && echo \"Derleme dizini: $BUILD_DIR\" && cd \"$BUILD_DIR\" && echo \"sdk.dir=$ANDROID_HOME\" > local.properties && curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13.zip && unzip -q -o /tmp/gradle-8.13.zip -d /tmp/gradle-dist && /tmp/gradle-dist/gradle-8.13/bin/gradle assembleDebug --no-daemon"},{"name":"8. APK Dosyasinin Olustugunu Dogrula","run":"APK_LIST=$(find client-src -name \"*.apk\" -type f) && if [ -z \"$APK_LIST\" ]; then echo \"HATA: APK uretilemedi!\"; exit 1; else echo \"APK basariyla uretildi:\"; ls -lh \"$APK_LIST\"; fi"},{"name":"9. APK Dosyasini Artifacts Bolumune Yukle","uses":"actions/upload-artifact@v4","with":{"name":"mobile2-lab-debug-apk","path":"client-src/**/*.apk","if-no-files-found":"error"}}]}}}
)"})"})"})")"}]}}}