{
  "name": "MOBILE2-LAB Dual APK Build",
  "on": {
    "push": {
      "branches": [
        "main",
        "master"
      ],
      "paths-ignore": [
        "patch/**",
        "research/**",
        "README.md"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build-dual-apks": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "1. Repo Cek",
          "uses": "actions/checkout@v5",
          "with": {
            "path": "self-repo"
          }
        },
        {
          "name": "2. Java 17 Kur",
          "uses": "actions/setup-java@v5",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "name": "3. SDK NDK CMake Kur",
          "run": "bash self-repo/scripts/setup_sdk.sh"
        },
        {
          "name": "4. Kaynak ve Verileri Hazirla",
          "run": "bash self-repo/scripts/prepare_sources.sh"
        },
        {
          "name": "5. Yamalari Uygula",
          "env": {
            "ADMIN_SECRET": "${{ secrets.ADMIN_SECRET }}"
          },
          "run": "python3 self-repo/scripts/apply_patches.py"
        },
        {
          "name": "6. Imza Anahtarini Hazirla",
          "env": {
            "KEYSTORE_B64": "${{ secrets.ANDROID_KEYSTORE_B64 }}",
            "KEYSTORE_PASS": "${{ secrets.ANDROID_KEYSTORE_PASS }}",
            "KEY_ALIAS": "${{ secrets.ANDROID_KEY_ALIAS }}",
            "KEY_PASS": "${{ secrets.ANDROID_KEY_PASS }}"
          },
          "run": "bash self-repo/scripts/prepare_keystore.sh"
        },
        {
          "name": "7. Oyun ve GM Panel APK Derle",
          "env": {
            "KEYSTORE_PASS": "${{ secrets.ANDROID_KEYSTORE_PASS }}",
            "KEY_ALIAS": "${{ secrets.ANDROID_KEY_ALIAS }}",
            "KEY_PASS": "${{ secrets.ANDROID_KEY_PASS }}"
          },
          "run": "bash self-repo/scripts/build_apks.sh"
        },
        {
          "name": "8. Acik Kaynak Yamayi Yayinla",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "bash self-repo/scripts/publish_patch.sh"
        },
        {
          "name": "9-10. APKleri GitHub Releases Yukle",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "cd self-repo && ls -lh /tmp/m2bundle/metin2-live-base.apk /tmp/m2bundle/metin2-gm-panel.apk && (gh release view latest-apks >/dev/null 2>&1 || gh release create latest-apks --title \"Latest APKs\" --notes \"Guncel APK paketleri\") && gh release upload latest-apks /tmp/m2bundle/metin2-live-base.apk /tmp/m2bundle/metin2-gm-panel.apk --clobber"
        }
      ]
    }
  }
}
