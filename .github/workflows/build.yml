cd /workspaces/Metin2-Lab && python3 -c 'import json; wf={"name":"MOBILE2-LAB Dual APK Build","on":{"push":{"branches":["main","master"],"paths-ignore":["patch/**","research/**","README.md"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build-dual-apks":{"runs-on":"ubuntu-latest","steps":[{"name":"1. Repo Cek","uses":"actions/checkout@v5","with":{"path":"self-repo"}},{"name":"2. Java 17 Kur","uses":"actions/setup-java@v5","with":{"distribution":"temurin","java-version":"17"}},{"name":"3. SDK NDK CMake Kur","run":"bash self-repo/scripts/setup_sdk.sh"},{"name":"4. Kaynak ve Verileri Hazirla","run":"bash self-repo/scripts/prepare_sources.sh"},{"name":"5. Yamalari Uygula","env":{"ADMIN_SECRET":"${{ secrets.ADMIN_SECRET }}"},"run":"python3 self-repo/scripts/apply_patches.py"},{"name":"6. Imza Anahtarini Hazirla","env":{"KEYSTORE_B64":"${{ secrets.ANDROID_KEYSTORE_B64 }}","KEYSTORE_PASS":"${{ secrets.ANDROID_KEYSTORE_PASS }}","KEY_ALIAS":"${{ secrets.ANDROID_KEY_ALIAS }}","KEY_PASS":"${{ secrets.ANDROID_KEY_PASS }}"},"run":"bash self-repo/scripts/prepare_keystore.sh"},{"name":"7. Oyun ve GM Panel APK Derle","env":{"KEYSTORE_PASS":"${{ secrets.ANDROID_KEYSTORE_PASS }}","KEY_ALIAS":"${{ secrets.ANDROID_KEY_ALIAS }}","KEY_PASS":"${{ secrets.ANDROID_KEY_PASS }}"},"run":"bash self-repo/scripts/build_apks.sh"},{"name":"8. Acik Kaynak Yamayi Yayinla","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"bash self-repo/scripts/publish_patch.sh"},{"name":"9. Temiz Oyuncu APK Yukle","uses":"actions/upload-artifact@v6","with":{"name":"mobile2-lab-live-base-apk","path":"/tmp/m2bundle/metin2-live-base.apk","if-no-files-found":"error","retention-days":7}},{"name":"10. Ozel GM Panel APK Yukle","uses":"actions/upload-artifact@v6","with":{"name":"mobile2-lab-gm-panel-apk","path":"/tmp/m2bundle/metin2-gm-panel.apk","if-no-files-found":"error","retention-days":7}}]}}}; open(".github/workflows/build.yml","w").write(json.dumps(wf,separators=(",",":"))+"\n"); print("JSON GECERLI:", len(open(".github/workflows/build.yml").read()))'
